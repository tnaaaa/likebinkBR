<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bink Clone</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header>
        <h1 id="header-title">Dashboard</h1>
    </header>

    <main id="main-content">
        <!-- Dashboard View -->
        <section id="view-dashboard" class="view active">
            <div class="dashboard-cards">
                <div class="card main-stat">
                    <span class="label">Total Profit</span>
                    <h2 id="total-profit" class="val">0</h2>
                </div>
                <div class="card-grid">
                    <div class="card">
                        <span class="label">Hourly</span>
                        <h3 id="hourly-rate" class="val">0/h</h3>
                    </div>
                    <div class="card">
                        <span class="label">ROI</span>
                        <h3 id="total-roi" class="val">0%</h3>
                    </div>
                    <div class="card">
                        <span class="label">Win Rate</span>
                        <h3 id="win-rate" class="val">0%</h3>
                    </div>
                    <div class="card">
                        <span class="label">Total Hours</span>
                        <h3 id="total-hours" class="val">0</h3>
                    </div>
                </div>
            </div>
            <div class="chart-container">
                <canvas id="profitChart"></canvas>
            </div>
        </section>

        <!-- Add Session View -->
        <section id="view-add" class="view">
            <form id="add-form">
                <div class="form-row">
                    <div class="input-group">
                        <label>Date</label>
                        <input type="date" id="input-date" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="input-group">
                        <label>Start Time</label>
                        <input type="time" id="input-start" required>
                    </div>
                    <div class="input-group">
                        <label>End Time</label>
                        <input type="time" id="input-end" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="input-group">
                        <label>Buy-in</label>
                        <input type="number" id="input-buyin" step="0.01" required>
                    </div>
                    <div class="input-group">
                        <label>Cashout</label>
                        <input type="number" id="input-cashout" step="0.01" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="input-group">
                        <label>Game Type</label>
                        <select id="input-game">
                            <option value="NLH">No Limit Hold'em</option>
                            <option value="PLO">Pot Limit Omaha</option>
                            <option value="Short Deck">Short Deck</option>
                            <option value="Mixed">Mixed Games</option>
                            <option value="Tournament">Tournament</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Stakes</label>
                        <input type="text" id="input-stakes" placeholder="e.g. 1/2, 2/5">
                    </div>
                </div>
                <div class="input-group">
                    <label>Location (Casino/Room)</label>
                    <input type="text" id="input-location" placeholder="Enter location">
                </div>
                <div class="input-group">
                    <label>Tags (comma separated)</label>
                    <input type="text" id="input-tags" placeholder="e.g. Vegas, Tilt, Good Run">
                </div>
                <div class="input-group">
                    <label>Notes</label>
                    <textarea id="input-notes" rows="3"></textarea>
                </div>
                <button type="submit" class="btn-primary">Save Session</button>
            </form>
        </section>

        <!-- History View -->
        <section id="view-history" class="view">
            <div id="history-list"></div>
        </section>

        <!-- Settings View -->
        <section id="view-settings" class="view">
            <div class="card">
                <h3>Preferences</h3>
                <div class="input-group">
                    <label>Currency</label>
                    <select id="setting-currency">
                        <option value="USD">USD ($)</option>
                        <option value="JPY">JPY (¥)</option>
                        <option value="KRW">KRW (₩)</option>
                    </select>
                </div>
                <button id="btn-clear-data" class="btn-danger">Clear All Data</button>
            </div>
        </section>
    </main>

    <nav class="bottom-nav">
        <a href="#" class="nav-item active" data-target="view-dashboard">
            <span class="icon">📊</span>
            <span>Dash</span>
        </a>
        <a href="#" class="nav-item" data-target="view-add">
            <span class="icon">➕</span>
            <span>Add</span>
        </a>
        <a href="#" class="nav-item" data-target="view-history">
            <span class="icon">📜</span>
            <span>History</span>
        </a>
        <a href="#" class="nav-item" data-target="view-settings">
            <span class="icon">⚙️</span>
            <span>Settings</span>
        </a>
    </nav>

    <script src="./app.js"></script>
</body>
</html>
