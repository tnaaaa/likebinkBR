<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Bink Clone Tracker</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#121212">
    <!-- iOS PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Bankroll Tracker</h1>
        </header>

        <section class="dashboard">
            <div class="stat-box">
                <span class="label">Total Profit</span>
                <h2 id="total-profit">$0</h2>
            </div>
            <div class="stat-row">
                <div class="stat-box small">
                    <span class="label">Hourly</span>
                    <h3 id="hourly-rate">$0/h</h3>
                </div>
                <div class="stat-box small">
                    <span class="label">ROI</span>
                    <h3 id="total-roi">0%</h3>
                </div>
            </div>
        </section>

        <section class="chart-container">
            <canvas id="profitChart"></canvas>
        </section>

        <section class="add-session">
            <h3>Add Session</h3>
            <form id="session-form">
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group">
                    <label>Buy-in ($)</label>
                    <input type="number" id="buyin" required>
                </div>
                <div class="form-group">
                    <label>Cashout ($)</label>
                    <input type="number" id="cashout" required>
                </div>
                <div class="form-group">
                    <label>Duration (Hours)</label>
                    <input type="number" step="0.1" id="duration" required>
                </div>
                <button type="submit">Save Session</button>
            </form>
        </section>

        <section class="history">
            <h3>Recent Sessions</h3>
            <div id="session-list"></div>
        </section>
    </div>

    <script src="./app.js"></script>
</body>
</html>
